[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sumseal"
version = "0.1.0.dev0"
description = "Record a SHA-256 manifest of a folder of files and verify it later."
readme = "README.md"
authors = [{ name = "CyberDredge" }]
keywords = ["integrity", "manifest", "sha256", "checksum", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Archiving",
]
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/CyberDredge/sumseal"
Issues = "https://github.com/CyberDredge/sumseal/issues"

[project.scripts]
sumseal = "sumseal.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
